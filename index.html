<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="イマログ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121212" id="metaTheme">
<title>イマログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--accent:#5bb88a;--accent2:#3da66e;}
[data-theme="dark"]{
  --bg:#121212;--bg2:#1a1a1a;--bg3:#202020;--bg4:#242424;
  --border:#2a2a2a;--border2:#333333;
  --text:#e5e5e5;--text2:#b3b3b3;--text3:#7a7a7a;
  --del:#ff5c5c;--nav:#161616;
  --shadow:0 4px 16px rgba(0,0,0,.6);
  --r:14px;--rs:12px;
}
[data-theme="light"]{
  --bg:#fdfdfd;--bg2:#ffffff;--bg3:#f5f5f5;--bg4:#f0f0f0;
  --border:#e9e9e9;--border2:#e0e0e0;
  --text:#2d2d2d;--text2:#646464;--text3:#a5a5a5;
  --del:#d93c3c;--nav:#fafafa;
  --shadow:0 4px 16px rgba(45,45,45,.1);
  --r:14px;--rs:12px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;overflow:hidden;}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
svg{display:block;}
.shell{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;}
.pages{flex:1;overflow:hidden;position:relative;min-height:0;}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;visibility:hidden;}
.page.active{opacity:1;pointer-events:auto;visibility:visible;}
.page::-webkit-scrollbar{width:0;}
/* FOOTER NAV */
.footer{flex-shrink:0;background:var(--nav);border-top:1px solid var(--border);display:flex;padding:6px 2px;padding-bottom:max(6px,env(safe-area-inset-bottom));}
.nav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;color:var(--text3);font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;transition:color .15s;}
.nav-it:active{background:var(--bg3);}
.nav-it.active{color:var(--accent);}
.nav-ic{width:21px;height:21px;display:flex;align-items:center;justify-content:center;}
/* HEADERS */
.dash-top,.pg-hd{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;position:sticky;top:0;z-index:10;}
.app-nm{font-family:'Syne',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.5px;color:var(--accent);}
.pg-ti{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.3px;color:var(--text);}
.hd-right{display:flex;gap:6px;align-items:center;}
.th-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--bg2);color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.th-btn:active{transform:scale(.9);background:var(--bg3);}
.install-btn{display:none;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent);font-size:11px;font-family:'Syne',sans-serif;font-weight:700;flex-shrink:0;white-space:nowrap;}
.install-btn.show{display:flex;}
.back-btn{width:32px;height:32px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s;flex-shrink:0;}
.back-btn:active{transform:scale(.88);background:var(--bg3);}
.pg-hd-l{display:flex;align-items:center;gap:10px;min-width:0;}
</style>

<style>
.ic{width:18px;height:18px;flex-shrink:0;}
/* DASHBOARD */
#pg-dash{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.d-stat{margin:10px 14px 0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;flex-shrink:0;position:relative;overflow:hidden;}
.d-stat::before{content:'';position:absolute;top:-40px;right:-40px;width:100px;height:100px;border-radius:50%;pointer-events:none;opacity:.06;background:var(--cur-color,var(--text3));}
.st-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.st-hd{display:flex;align-items:center;gap:7px;}
.st-dot{width:8px;height:8px;border-radius:50%;background:var(--cur-color,var(--text3));flex-shrink:0;}
.st-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);}
.st-elapsed{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-family:'DM Mono',monospace;font-size:11px;background:color-mix(in srgb,var(--cur-color,var(--text3)) 13%,transparent);color:var(--cur-color,var(--text3));flex-shrink:0;}
.st-main{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.st-ic-wrap{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cur-color,var(--text3)) 16%,transparent);color:var(--cur-color,var(--text3));flex-shrink:0;}
.st-ic-wrap .ic{width:19px;height:19px;}
.st-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;line-height:1.15;color:var(--text);}
.st-sub{font-size:11px;color:var(--text2);margin-top:4px;}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 14px 0;flex-shrink:0;}
.st-c{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 6px;text-align:center;}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="shell">
  <div class="pages">
    <!-- ============ DASHBOARD ============ -->
    <div class="page active" id="pg-dash">
      <div class="dash-top">
        <div class="app-nm">イマログ</div>
        <div class="hd-right">
          <button class="install-btn" id="installBtn" onclick="installPWA()">
            <svg class="ic" style="width:13px;height:13px"><use href="#ic-download"/></svg>アプリ化</button>
          <button class="th-btn" id="thBtn" onclick="toggleTheme()">
            <svg class="ic" id="thIcMoon" style="width:16px;height:16px"><use href="#ic-moon"/></svg>
            <svg class="ic" id="thIcSun" style="width:16px;height:16px;display:none"><use href="#ic-sun"/></svg>
          </button>
        </div>
      </div>

      <div class="d-stat" id="dStat">
        <div class="st-row1">
          <div class="st-hd"><div class="st-dot" id="stDot"></div><div class="st-lbl">今やっていること</div></div>
          <div class="st-elapsed" id="stElapsed">—</div>
        </div>
        <div class="st-main">
          <div class="st-ic-wrap" id="stIcWrap"><svg class="ic" id="stIcUse"><use href="#ic-question"/></svg></div>
          <span class="st-name" id="stName">未記録</span>
        </div>
        <div class="st-sub" id="stSub">下のボタンから今の行動を記録しよう</div>
      </div>

      <div class="d-stats">
        <div class="st-c"><div class="st-v" id="sToday">0</div><div class="st-l">今日の<br>記録数</div></div>
        <div class="st-c"><div class="st-v" id="sTopCat">—</div><div class="st-l">今日の<br>最長行動</div></div>
        <div class="st-c"><div class="st-v" id="sActiveH">—</div><div class="st-l">記録<br>開始時刻</div></div>
      </div>

      <div class="d-tl">
        <div class="d-tl-hd"><div class="d-tl-ti">今日のタイムライン</div></div>
        <div class="d-tl-bar" id="tlBar"></div>
        <div class="d-tl-hrs"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>24時</span></div>
        <div class="d-tl-legend" id="tlLegend"></div>
      </div>

      <div class="d-acts-wrap">
        <div class="d-acts-hd">
          <div class="d-acts-ti">今、何してる？</div>
          <div class="d-acts-edit" onclick="goPage('my')">
            <svg class="ic" style="width:12px;height:12px"><use href="#ic-pencil"/></svg>編集</div>
        </div>
        <div class="d-acts" id="dActs"></div>
      </div>
    </div>

    <!-- ============ RECORDS ============ -->
    <div class="page" id="pg-rec">
      <div class="pg-hd"><div class="pg-ti">記録一覧</div></div>
      <div class="rl-wrap" id="recWrap"><div id="recL"></div></div>
      <button class="fab" onclick="openManualDr(null)"><svg class="ic"><use href="#ic-plus"/></svg></button>
    </div>

    <!-- ============ REPORT ============ -->
    <div class="page" id="pg-rep">
      <div class="pg-hd"><div class="pg-ti">レポート</div></div>
      <div class="rep-tabs">
        <button class="rep-tab" id="repTabCal" onclick="setRepMode('cal')">カレンダー</button>
        <button class="rep-tab" id="repTabWeek" onclick="setRepMode('week')">週間</button>
        <button class="rep-tab" id="repTabMonth" onclick="setRepMode('month')">月間</button>
      </div>
      <div class="rep-body" id="repBody"></div>

    <!-- ============ MY PAGE ============ -->
    <div class="page" id="pg-my">
      <div class="pg-hd"><div class="pg-ti">マイページ</div></div>

      <div class="my-sec">
        <div class="my-st">通算データ</div>
        <div class="my-sg">
          <div class="my-sv"><div class="my-svv" id="myTot">0</div><div class="my-svl">総記録数</div></div>
          <div class="my-sv"><div class="my-svv" id="myDays">0</div><div class="my-svl">記録日数</div></div>
          <div class="my-sv"><div class="my-svv" id="myCats">0</div><div class="my-svl">カテゴリ数</div></div>
          <div class="my-sv"><div class="my-svv" id="myTopAll">—</div><div class="my-svl">最多カテゴリ</div></div>
        </div>
      </div>

      <div class="my-sec">
        <div class="my-st">カテゴリ管理</div>
        <div id="catManageList"></div>
        <div class="my-row tap" onclick="openCatEditPage(null)">
          <svg class="ic"><use href="#ic-plus"/></svg><span style="color:var(--accent);flex:1">カテゴリを追加</span></div>
      </div>

      <div class="my-sec">
        <div class="my-st">設定</div>
        <div class="my-row tap" onclick="toggleTheme()"><svg class="ic" id="myThIc"><use href="#ic-moon"/></svg><span style="flex:1">テーマ</span><span class="my-rv" id="thLbl" style="margin-right:8px">ダーク</span><div class="tog on" id="togDk"><div class="tog-k"></div></div></div>
        <div class="my-row tap" onclick="toggleWeekStart()"><svg class="ic"><use href="#ic-calendar"/></svg><span style="flex:1">カレンダー週始まり</span><span class="my-rv" id="weekStartLbl">月曜始まり</span></div>
        <div class="my-row"><span style="flex:1">アクセントカラー</span><div class="acc-picker" id="myAccPicker"></div></div>
      </div>

      <div class="my-sec">
        <div class="my-st">このアプリについて</div>
        <div class="my-row"><span style="flex:1">アプリ名</span><span class="my-rv">イマログ</span></div>
        <div class="my-row tap" onclick="shareApp()"><svg class="ic"><use href="#ic-share"/></svg><span style="flex:1">友達に共有する</span></div>
      </div>

      <div class="my-sec" style="margin-bottom:24px;">
        <div class="my-st">データ管理</div>
        <div class="my-row tap" onclick="exportCSV()"><svg class="ic"><use href="#ic-download"/></svg><span style="flex:1">CSVエクスポート</span></div>
        <div class="my-row tap" onclick="triggerCSVImport()"><svg class="ic"><use href="#ic-upload"/></svg><span style="flex:1">CSVインポート</span></div>
        <input type="file" accept=".csv,text/csv,text/plain" id="csvImportInput" style="position:fixed;top:-999px;left:-999px;opacity:0;width:1px;height:1px;" onchange="importCSV(this)">
        <div class="my-row tap danger" onclick="confirmClearAll()"><svg class="ic"><use href="#ic-trash"/></svg><span style="flex:1">すべての記録を削除</span></div>
      </div>
    </div>

    <!-- ============ CATEGORY EDIT (dedicated page) ============ -->
    <div class="page" id="pg-catedit">
      <div class="pg-hd">
        <div class="pg-hd-l">
          <button class="back-btn" onclick="closeCatEditPage()"><svg class="ic" style="width:15px;height:15px"><use href="#ic-chevron-l"/></svg></button>
          <div class="pg-ti" id="ceTitle">カテゴリを追加</div>
        </div>
      </div>
      <div class="ce-body">
        <div class="ce-preview">
          <div class="ce-preview-ic" id="cePreviewIc"><svg class="ic"><use href="#ic-work"/></svg></div>
          <div class="ce-preview-nm" id="cePreviewNm">新しいカテゴリ</div>
        </div>
        <div class="ce-field">
          <label>名前</label>
          <input type="text" class="dr-input" id="catNameInput" placeholder="例：読書" maxlength="12" oninput="ceUpdatePreview()">
        </div>
        <div class="ce-field">
          <label>アイコン</label>
          <div class="icon-grid" id="catIconGrid"></div>
        </div>
        <div class="ce-field">
          <label>カラー</label>

        </div>
        <button class="ce-ok" onclick="saveCatEdit()">保存する</button>
        <button class="ce-del" id="catDeleteBtn" onclick="deleteCatFromEdit()" style="display:none;">このカテゴリを削除</button>
      </div>
    </div>
  </div>

  <nav class="footer">
    <button class="nav-it active" id="nv-dash" onclick="goPage('dash')">
      <div class="nav-ic"><svg class="ic"><use href="#ic-home"/></svg></div>ホーム
    </button>
    <button class="nav-it" id="nv-rec" onclick="goPage('rec')">
      <div class="nav-ic"><svg class="ic"><use href="#ic-list"/></svg></div>記録
    </button>
    <button class="nav-it" id="nv-rep" onclick="goPage('rep')">
      <div class="nav-ic"><svg class="ic"><use href="#ic-chart"/></svg></div>レポート
    </button>
    <button class="nav-it" id="nv-my" onclick="goPage('my')">
      <div class="nav-ic"><svg class="ic"><use href="#ic-user"/></svg></div>マイページ
    </button>
  </nav>
</div>

<div class="ov" id="ov" onclick="closeAllDr()"></div>

<!-- Manual record add/edit drawer -->
<div class="dr" id="drManual">
  <div class="dr-handle"></div>
  <div class="dr-ti" id="drManualTi">記録を追加</div>
  <div class="dr-field">
    <label>カテゴリ</label>
    <div class="dr-cat-grid" id="drCatPicker"></div>
  </div>
  <div class="dr-time-row">
    <div class="dr-field" style="margin:0;">
      <label>日付</label>
      <input type="date" class="dr-input" id="drDate">
    </div>

      <label>時刻</label>

    </div>

<div class="dr" id="drDayDetail">
  <div class="dr-handle"></div>
  <div class="dr-ti" id="ddTitle">日付</div>
  <div style="margin:0 14px 14px;">
    <div class="rep-hero" style="margin-bottom:12px;" id="ddHero"></div>
    <div id="ddList"></div>
  </div>
</div>

    <div class="confirm-title" id="confirmTitle">確認</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" onclick="closeConfirm()">キャンセル</button>
      <button class="confirm-btn ok" id="confirmOkBtn">実行</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   イマログ — 今何してる？記録アプリ
   ============================================================ */

const LS_RECS='imalog_recs', LS_CATS='imalog_cats', LS_TH='imalog_theme', LS_ACC='imalog_accent', LS_WS='imalog_weekstart';

const DEFAULT_CATS = [
  {id:'work',  nm:'仕事', ic:'ic-work',   c:'#6b8fd4'},
  {id:'break', nm:'休憩', ic:'ic-coffee', c:'#d4a050'},
  {id:'move',  nm:'移動', ic:'ic-train',  c:'#9060e0'},
  {id:'meal',  nm:'食事', ic:'ic-meal',   c:'#e0708a'},
  {id:'study', nm:'勉強', ic:'ic-book',   c:'#5bb88a'},
  {id:'sleep', nm:'睡眠', ic:'ic-sleep',  c:'#5580c0'},
];
const ICON_CHOICES = ['ic-work','ic-coffee','ic-train','ic-meal','ic-book','ic-sleep','ic-game','ic-run','ic-bath','ic-phone','ic-clean','ic-cart','ic-palette','ic-music','ic-meditate','ic-people','ic-pet','ic-tv','ic-laptop','ic-drink','ic-dumbbell','ic-tree','ic-star'];
const COLOR_CHOICES = ['#5bb88a','#6b8fd4','#d4a050','#e0708a','#9060e0','#4fb5c0','#e0a868','#c0596b','#7dc4a8','#8896c8'];
const ACCENTS = ['#5bb88a','#6b8fd4','#d4a050','#e0708a','#9060e0','#4fb5c0'];
const WD = ['日','月','火','水','木','金','土'];

let recs = JSON.parse(localStorage.getItem(LS_RECS) || '[]');
let cats = JSON.parse(localStorage.getItem(LS_CATS) || 'null') || DEFAULT_CATS.slice();
let currentAccent = localStorage.getItem(LS_ACC) || '#5bb88a';
let weekStart = parseInt(localStorage.getItem(LS_WS) || '1');
let editingCatId = null, editingRecId = null;
let deferredPrompt = null;

// caches to keep records tab light
let sortedCache = null, sortedCacheLen = -1;
let recChunkSize = 40;   // how many *sessions* rendered initially
let recRendered = 0;

function save(){ localStorage.setItem(LS_RECS, JSON.stringify(recs)); sortedCache=null; }
function saveCats(){ localStorage.setItem(LS_CATS, JSON.stringify(cats)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function getCat(id){ return cats.find(c=>c.id===id); }
function iconOf(cat){ return cat ? cat.ic : 'ic-question'; }

/* ---------- time helpers ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayKey(d){ return fmtDate(d); }
function fmtDur(mins){
  if(mins<1) return '1分未満';
  const h=Math.floor(mins/60), m=Math.round(mins%60);
  if(h===0) return `${m}分`;
  if(m===0) return `${h}時間`;
  return `${h}時間${m}分`;
}
function fmtElapsed(startTs){
  const mins = Math.floor((Date.now()-new Date(startTs).getTime())/60000);
  return fmtDur(Math.max(mins,0));
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function svgUse(iconId, cls){ return `<svg class="${cls||'ic'}"><use href="#${iconId}"/></svg>`; }

/* sorted ascending by ts, cached until save() invalidates */
function sortedRecs(){
  if(sortedCache && sortedCacheLen===recs.length) return sortedCache;
  sortedCache = [...recs].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  sortedCacheLen = recs.length;
  return sortedCache;
}
/* sessions from an already-sorted list slice */
function sessionsFrom(list){
  const out=[];
  for(let i=0;i<list.length;i++){
    const start=new Date(list[i].ts);
    const end = i+1<list.length ? new Date(list[i+1].ts) : new Date();
    const durMin = Math.max(0,(end-start)/60000);
    out.push({rec:list[i], start, end, durMin, isCurrent:i+1>=list.length});
  }
  return out;
}

/* ---------- NAV ---------- */
function goPage(name){
  if(name==='catedit-internal'){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('pg-catedit').classList.add('active');
    return;
  }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-it').forEach(n=>n.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  const nv=document.getElementById('nv-'+name); if(nv) nv.classList.add('active');
  if(name==='rec'){ recRendered=0; renderRec(); }
  if(name==='rep') renderReport();
  if(name==='my') renderMy();
  if(name==='dash') renderDash();
}

function logNow(catId){
  recs.push({id:uid(), catId, ts:new Date().toISOString()});
  save();
  renderDash();
  const c=getCat(catId);
  toast(`${c?c.nm:''}を記録しました`);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDash(){
  renderStatus(); renderTodayStats(); renderTimeline(); renderActButtons();
}
function renderStatus(){
  const s=sortedRecs();
  const dStat=document.getElementById('dStat');
  const icWrap=document.getElementById('stIcWrap');
  if(!s.length){
    dStat.style.removeProperty('--cur-color');
    document.getElementById('stIcUse').innerHTML=`<use href="#ic-question"/>`;
    document.getElementById('stName').textContent='未記録';
    document.getElementById('stSub').textContent='下のボタンから今の行動を記録しよう';
    document.getElementById('stElapsed').textContent='—';
    return;
  }
  const last=s[s.length-1];
  const c=getCat(last.catId);
  dStat.style.setProperty('--cur-color', c?c.c:'#7a7a7a');
  document.getElementById('stIcUse').innerHTML=`<use href="#${iconOf(c)}"/>`;
  document.getElementById('stName').textContent = c?c.nm:'（削除済み）';
  document.getElementById('stSub').textContent = fmtTime(new Date(last.ts))+' から継続中';
  document.getElementById('stElapsed').textContent = fmtElapsed(last.ts);
}
function renderTodayStats(){
  const today=dayKey(new Date());
  const s=sortedRecs();
  const todayRecs = s.filter(r=>dayKey(new Date(r.ts))===today);
  document.getElementById('sToday').textContent = todayRecs.length;
  if(!todayRecs.length){
    document.getElementById('sTopCat').textContent='—';
    document.getElementById('sActiveH').textContent='—';
    return;
  }
  const sess = sessionsFrom(s).filter(x=>dayKey(x.start)===today);
  const byCat={};
  sess.forEach(x=>{ byCat[x.rec.catId]=(byCat[x.rec.catId]||0)+x.durMin; });
  let topId=null, topV=-1;
  Object.entries(byCat).forEach(([k,v])=>{ if(v>topV){topV=v;topId=k;} });
  const tc=getCat(topId);
  document.getElementById('sTopCat').innerHTML = tc ? svgUse(iconOf(tc))+' '+esc(tc.nm) : '—';
  document.getElementById('sActiveH').textContent = fmtTime(new Date(todayRecs[0].ts));
}
function renderTimeline(){
  const today=dayKey(new Date());
  const bar=document.getElementById('tlBar'), legend=document.getElementById('tlLegend');
  bar.innerHTML=''; legend.innerHTML='';
  const sess=sessionsFrom(sortedRecs()).filter(x=>dayKey(x.start)===today);
  if(!sess.length){
    bar.innerHTML=`<div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);">まだ記録がありません</div>`;
    return;
  }
  const dayStart=new Date(); dayStart.setHours(0,0,0,0);
  const dayMs=86400000;
  const usedCats=new Set();
  const frag=document.createDocumentFragment();
  sess.forEach(x=>{
    const startMs=Math.max(0,x.start-dayStart), endMs=Math.min(dayMs,x.end-dayStart);
    const widthPct=Math.max(0.3,(endMs-startMs)/dayMs*100);
    const c=getCat(x.rec.catId);
    const seg=document.createElement('div');
    seg.className='d-tl-seg';
    seg.style.width=widthPct+'%';
    seg.style.background=c?c.c:'#555';
    seg.title=(c?c.nm:'')+' '+fmtTime(x.start)+'〜';
    frag.appendChild(seg);
    if(c) usedCats.add(c.id);
  });
  bar.appendChild(frag);
  usedCats.forEach(id=>{
    const c=getCat(id); if(!c) return;
    const it=document.createElement('div'); it.className='leg-it';
    it.innerHTML=`<span class="leg-dot" style="background:${c.c}"></span>${svgUse(iconOf(c),'ic')} ${esc(c.nm)}`;
    it.querySelector('svg').style.cssText='width:11px;height:11px;';
    legend.appendChild(it);
  });
}
function renderActButtons(){
  const wrap=document.getElementById('dActs');
  const s=sortedRecs();
  const curCatId = s.length ? s[s.length-1].catId : null;
  const frag=document.createDocumentFragment();
  cats.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='a-btn'+(c.id===curCatId?' cur':'');
    btn.style.setProperty('--a-c', c.c);
    btn.style.setProperty('--a-s', c.c+'22');
    btn.onclick=()=>logNow(c.id);
    btn.innerHTML=`<span class="ab-ic">${svgUse(c.ic)}</span>
      <div class="ab-body"><span class="ab-ti">${esc(c.nm)}</span><span class="ab-tm">${c.id===curCatId?'記録中':'タップで記録'}</span></div>`;
    frag.appendChild(btn);
  });
  wrap.innerHTML='';
  wrap.appendChild(frag);
}

/* ============================================================
   RECORDS PAGE — lightweight, chunked, session-based grouping
   ============================================================ */
function renderRec(){
  const listEl=document.getElementById('recL');
  listEl.innerHTML='';
  if(!recs.length){
    listEl.innerHTML=`<div class="empty">まだ記録がありません<br>ホームのボタンをタップして<br>最初の記録をつけましょう</div>`;
    return;
  }
  recRendered=0;
  appendRecChunk();
}
function appendRecChunk(){
  const listEl=document.getElementById('recL');
  const sessAll = sessionsFrom(sortedRecs());
  const sessDesc = sessAll.slice().reverse(); // newest first, computed once per call (cheap: O(n))
  const slice = sessDesc.slice(recRendered, recRendered+recChunkSize);
  if(!slice.length) return;

  const frag=document.createDocumentFragment();
  // determine current day header context by looking at last rendered day (data attr)
  let curDay = listEl.dataset.lastDay || null;
  slice.forEach(x=>{
    const dk=dayKey(x.start);
    if(dk!==curDay){
      curDay=dk;
      const hd=document.createElement('div');
      hd.className='rec-dg-hd';
      hd.textContent=fmtDayHeader(x.start);
      frag.appendChild(hd);
    }
    const c=getCat(x.rec.catId);
    const item=document.createElement('div');
    item.className='rec-item';
    item.style.setProperty('--r-c', c?c.c:'#7a7a7a');
    item.style.setProperty('--r-s', (c?c.c:'#7a7a7a')+'22');
    item.innerHTML=`
      <div class="rec-ic">${svgUse(iconOf(c))}</div>
      <div class="rec-body">
        <div class="rec-nm">${c?esc(c.nm):'（削除済み）'}</div>
        <div class="rec-tm">${fmtTime(x.start)} 〜 ${x.isCurrent?'現在':fmtTime(x.end)}</div>
      </div>
      <div class="rec-dur">${x.isCurrent?'記録中':fmtDur(x.durMin)}</div>
      <div class="rec-acts">
        <button class="rib ed" onclick="openManualDr('${x.rec.id}')">${svgUse('ic-pencil')}</button>
        <button class="rib dl" onclick="confirmDeleteRec('${x.rec.id}')">${svgUse('ic-trash')}</button>
      </div>`;
    frag.appendChild(item);
  });
  listEl.dataset.lastDay = curDay;
  listEl.appendChild(frag);
  recRendered += slice.length;

  // remove old load-more button, add new if more remain
  const oldBtn = document.getElementById('recLoadMore');
  if(oldBtn) oldBtn.remove();
  if(recRendered < sessDesc.length){
    const btn=document.createElement('button');
    btn.id='recLoadMore';
    btn.className='load-more-btn';
    btn.textContent=`もっと見る（残り${sessDesc.length-recRendered}件）`;
    btn.onclick=appendRecChunk;
    listEl.appendChild(btn);
  }
}
function fmtDayHeader(d){
  const today=new Date(); today.setHours(0,0,0,0);
  const dd=new Date(d); dd.setHours(0,0,0,0);
  const diff=Math.round((today-dd)/86400000);
  const base=`${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;
  if(diff===0) return '今日 · '+base;
  if(diff===1) return '昨日 · '+base;
  return base;
}
function confirmDeleteRec(id){
  showConfirm({title:'記録を削除', msg:'この記録を削除します。\nこの操作は取り消せません。', okLabel:'削除する',
    cb:()=>{ recs=recs.filter(r=>r.id!==id); save(); renderDash();
      if(document.getElementById('pg-rec').classList.contains('active')){ recRendered=0; document.getElementById('recL').dataset.lastDay=''; renderRec(); }
      toast('削除しました'); } });
}

/* ============================================================
   REPORT — カレンダー / 週間 / 月間
   ============================================================ */
let repMode='cal';       // 'cal' | 'week' | 'month'
let calMonthOffset=0;    // for calendar & month view
let weekOffset=0;        // for week view

function setRepMode(m){
  repMode=m;
  document.getElementById('repTabCal').classList.toggle('on', m==='cal');
  document.getElementById('repTabWeek').classList.toggle('on', m==='week');
  document.getElementById('repTabMonth').classList.toggle('on', m==='month');
  renderReport();
}
function renderReport(){
  setRepModeTabsInit();
  const body=document.getElementById('repBody');
  if(repMode==='cal') renderCalView(body);
  else if(repMode==='week') renderWeekView(body);
  else renderMonthView(body);
}
function setRepModeTabsInit(){
  document.getElementById('repTabCal').classList.toggle('on', repMode==='cal');
  document.getElementById('repTabWeek').classList.toggle('on', repMode==='week');
  document.getElementById('repTabMonth').classList.toggle('on', repMode==='month');
}

/* ---- shared: aggregate sessions overlapping [start,end) ---- */
function sessionsInRange(start,end){
  return sessionsFrom(sortedRecs()).filter(x=>x.start<end && x.end>start);
}
function catBreakdown(sess){
  const byCat={};
  sess.forEach(x=>{ byCat[x.rec.catId]=(byCat[x.rec.catId]||0)+x.durMin; });
  return byCat;
}
function renderCatBreakdownHtml(byCat, totalMin){
  let html='';
  Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(([id,mins])=>{
    const c=getCat(id);
    const pct = totalMin>0 ? mins/totalMin*100 : 0;
    html += `<div class="rep-cat-row">
      <div class="rep-cat-ic" style="background:${(c?c.c:'#7a7a7a')}22;color:${c?c.c:'#7a7a7a'}">${svgUse(iconOf(c))}</div>
      <span class="rep-cat-nm">${c?esc(c.nm):'（削除済み）'}</span>
      <div class="rep-cat-bar-bg"><div class="rep-cat-bar-fill" style="width:${pct}%;background:${c?c.c:'#7a7a7a'}"></div></div>
      <span class="rep-cat-v">${fmtDur(mins)}</span>
    </div>`;
  });
  return html || `<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px;">記録がありません</div>`;
}

/* ---------- CALENDAR VIEW (month grid, tap day -> detail) ---------- */
function renderCalView(body){
  const now=new Date();
  const base=new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
  const y=base.getFullYear(), m=base.getMonth();
  const monthStart=new Date(y,m,1), monthEnd=new Date(y,m+1,1);

  const firstDow = monthStart.getDay(); // 0=sun
  const leadBlanks = weekStart===1 ? (firstDow===0?6:firstDow-1) : firstDow;
  const daysInMonth = new Date(y,m+1,0).getDate();

  const sess = sessionsInRange(monthStart, monthEnd);
  const dayTotals = {}; // dayKey -> {total, byCat}
  sess.forEach(x=>{
    const dk=dayKey(x.start);
    if(!dayTotals[dk]) dayTotals[dk]={total:0, cats:{}};
    dayTotals[dk].total += x.durMin;
    dayTotals[dk].cats[x.rec.catId] = (dayTotals[dk].cats[x.rec.catId]||0)+x.durMin;
  });
  const maxDayTotal = Math.max(1, ...Object.values(dayTotals).map(d=>d.total));

  const wdLabels = weekStart===1 ? ['月','火','水','木','金','土','日'] : ['日','月','火','水','木','金','土'];

  let html = `<div class="rep-nav">
    <button class="rep-nb" onclick="calMonthOffset--;renderReport()">${svgUse('ic-chevron-l')}</button>
    <div class="rep-period-ti">${y}年${m+1}月</div>
    <button class="rep-nb" onclick="calMonthOffset++;renderReport()">${svgUse('ic-chevron-r')}</button>
  </div>
  <div class="cal-wd-row">${wdLabels.map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
  <div class="cal-grid">`;

  for(let i=0;i<leadBlanks;i++) html += `<div class="cal-cell empty"></div>`;
  const todayKey = dayKey(now);
  for(let d=1;d<=daysInMonth;d++){
    const dateObj=new Date(y,m,d);
    const dk=dayKey(dateObj);
    const info=dayTotals[dk];
    const isToday = dk===todayKey;
    const heatOpacity = info ? Math.min(0.9, 0.15 + (info.total/maxDayTotal)*0.75) : 0;
    let dotsHtml='';
    if(info){
      const topCats = Object.entries(info.cats).sort((a,b)=>b[1]-a[1]).slice(0,3);
      dotsHtml = `<div class="cal-dots">${topCats.map(([cid])=>{ const c=getCat(cid); return `<span class="cal-dot" style="background:${c?c.c:'#7a7a7a'}"></span>`; }).join('')}</div>`;
    }
    html += `<div class="cal-cell ${info?'tap':''} ${isToday?'today':''}" ${info?`onclick="openDayDetail('${dk}')"`:''}>
      ${info?`<div class="cal-heat" style="background:${topCatColor(info.cats)};opacity:${heatOpacity}"></div>`:''}
      <span class="cal-daynum">${d}</span>${dotsHtml}
    </div>`;
  }
  html += `</div>`;

  // month summary below calendar
  const monthByCat = catBreakdown(sess);
  const monthTotal = sess.reduce((a,x)=>a+x.durMin,0);
  html += `<div class="rep-sec-title">${m+1}月のカテゴリ別内訳</div>
  <div class="rep-cat-wrap">${renderCatBreakdownHtml(monthByCat, monthTotal)}</div>
  <button class="csv-btn" onclick="exportCSV()">${svgUse('ic-download')}CSVでエクスポート</button>`;

  body.innerHTML = html;
}
function topCatColor(catsObj){
  let topId=null, topV=-1;
  Object.entries(catsObj).forEach(([k,v])=>{ if(v>topV){topV=v;topId=k;} });
  const c=getCat(topId);
  return c?c.c:'#7a7a7a';
}

/* ---------- WEEK VIEW ---------- */
function getWeekRange(offset){
  const now=new Date();
  const day=now.getDay();
  const diffToStart = weekStart===1 ? (day===0?-6:1-day) : -day;
  const start=new Date(now); start.setHours(0,0,0,0);
  start.setDate(start.getDate()+diffToStart+offset*7);
  const end=new Date(start); end.setDate(start.getDate()+7);
  return {start,end};
}
function renderWeekView(body){
  const {start,end} = getWeekRange(weekOffset);
  const sess = sessionsInRange(start,end);
  const totalMin = sess.reduce((a,x)=>a+x.durMin,0);
  const byCat = catBreakdown(sess);
  let topId=null, topV=-1;
  Object.entries(byCat).forEach(([k,v])=>{ if(v>topV){topV=v;topId=k;} });
  const topC=getCat(topId);

  const periodTi = weekOffset===0 ? '今週' : `${start.getMonth()+1}/${start.getDate()} 〜 ${new Date(end-1).getMonth()+1}/${new Date(end-1).getDate()}`;

  let html = `<div class="rep-nav">
    <button class="rep-nb" onclick="weekOffset--;renderReport()">${svgUse('ic-chevron-l')}</button>
    <div class="rep-period-ti">${periodTi}</div>
    <button class="rep-nb" ${weekOffset>=0?'disabled':''} onclick="weekOffset++;renderReport()">${svgUse('ic-chevron-r')}</button>
  </div>`;

  html += `<div class="rep-hero">
    <div class="rep-hcard"><div class="rep-hl">合計時間</div><div class="rep-hv">${fmtDur(totalMin)}</div><div class="rep-hsub">${sess.length}件の記録</div></div>
    <div class="rep-hcard"><div class="rep-hl">最多カテゴリ</div><div class="rep-hv" style="font-size:15px">${topC?svgUse(iconOf(topC))+' '+esc(topC.nm):'—'}</div><div class="rep-hsub">${topC?fmtDur(topV):''}</div></div>
  </div>`;

  html += `<div class="rep-sec-title">日別</div>`;
  const daysArr=[]; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); daysArr.push(d); }
  const maxDay = Math.max(1, ...daysArr.map(d=>{ const dk=dayKey(d); return sess.filter(x=>dayKey(x.start)===dk).reduce((a,x)=>a+x.durMin,0); }));
  const todayKey=dayKey(new Date());
  daysArr.forEach(d=>{
    const dk=dayKey(d);
    const daySess = sess.filter(x=>dayKey(x.start)===dk);
    const dTotal = daySess.reduce((a,x)=>a+x.durMin,0);
    const isToday = dk===todayKey;
    let segs='';
    if(dTotal>0) daySess.forEach(x=>{ const c=getCat(x.rec.catId); segs+=`<div style="width:${x.durMin/dTotal*100}%;background:${c?c.c:'#666'}"></div>`; });
    html += `<div class="week-day-row ${dTotal>0?'tap':''} ${isToday?'today':''}" ${dTotal>0?`onclick="openDayDetail('${dk}')"`:''}>
      <div><div class="week-day-dow">${WD[d.getDay()]}</div><div class="week-day-date">${d.getDate()}</div></div>
      <div class="week-day-bar">${segs}</div>
      <div class="week-day-total">${dTotal>0?fmtDur(dTotal):'—'}</div>
    </div>`;
  });

  html += `<div class="rep-sec-title">カテゴリ別の内訳</div>
  <div class="rep-cat-wrap">${renderCatBreakdownHtml(byCat, totalMin)}</div>
  <button class="csv-btn" onclick="exportCSV()">${svgUse('ic-download')}CSVでエクスポート</button>`;

  body.innerHTML = html;
}

/* ---------- MONTH VIEW (aggregate stats + weekly bars, no grid) ---------- */
function renderMonthView(body){
  const now=new Date();
  const base=new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
  const y=base.getFullYear(), m=base.getMonth();
  const monthStart=new Date(y,m,1), monthEnd=new Date(y,m+1,1);
  const sess = sessionsInRange(monthStart, monthEnd);
  const totalMin = sess.reduce((a,x)=>a+x.durMin,0);
  const byCat = catBreakdown(sess);
  let topId=null, topV=-1;
  Object.entries(byCat).forEach(([k,v])=>{ if(v>topV){topV=v;topId=k;} });
  const topC=getCat(topId);
  const activeDays = new Set(sess.map(x=>dayKey(x.start))).size;
  const daysInMonth = new Date(y,m+1,0).getDate();

  let html = `<div class="rep-nav">
    <button class="rep-nb" onclick="calMonthOffset--;renderReport()">${svgUse('ic-chevron-l')}</button>
    <div class="rep-period-ti">${y}年${m+1}月</div>
    <button class="rep-nb" onclick="calMonthOffset++;renderReport()">${svgUse('ic-chevron-r')}</button>
  </div>`;

  html += `<div class="rep-hero">
    <div class="rep-hcard"><div class="rep-hl">合計時間</div><div class="rep-hv">${fmtDur(totalMin)}</div><div class="rep-hsub">${sess.length}件の記録</div></div>
    <div class="rep-hcard"><div class="rep-hl">記録日数</div><div class="rep-hv">${activeDays}<span style="font-size:11px;color:var(--text2);margin-left:2px;">/ ${daysInMonth}日</span></div><div class="rep-hsub">1日平均 ${fmtDur(activeDays?totalMin/activeDays:0)}</div></div>
  </div>`;

  html += `<div class="rep-hero" style="grid-template-columns:1fr;">
    <div class="rep-hcard"><div class="rep-hl">最多カテゴリ</div><div class="rep-hv" style="font-size:16px">${topC?svgUse(iconOf(topC))+' '+esc(topC.nm):'—'}</div><div class="rep-hsub">${topC?fmtDur(topV)+'（全体の'+Math.round(topV/totalMin*100)+'%）':''}</div></div>
  </div>`;

  // weekly totals within month (bars)
  html += `<div class="rep-sec-title">週別の推移</div><div class="rep-cat-wrap" style="padding:14px;">`;
  const weeks=[];
  let wkStart=new Date(monthStart);
  // align to weekStart
  const dow=wkStart.getDay();
  const back = weekStart===1 ? (dow===0?6:dow-1) : dow;
  wkStart.setDate(wkStart.getDate()-back);
  while(wkStart<monthEnd){
    const wkEnd=new Date(wkStart); wkEnd.setDate(wkStart.getDate()+7);
    weeks.push({start:new Date(wkStart), end:wkEnd});
    wkStart=wkEnd;
  }
  const maxWk = Math.max(1, ...weeks.map(w=>sessionsInRange(w.start,w.end).reduce((a,x)=>a+x.durMin,0)));
  weeks.forEach((w,i)=>{
    const wSess = sessionsInRange(w.start,w.end);
    const wTotal = wSess.reduce((a,x)=>a+x.durMin,0);
    const pct = wTotal/maxWk*100;
    html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:${i<weeks.length-1?'8px':'0'};">
      <span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);width:34px;flex-shrink:0;">第${i+1}週</span>
      <div style="flex:1;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:var(--accent);border-radius:5px;"></div></div>
      <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);width:52px;text-align:right;flex-shrink:0;">${wTotal>0?fmtDur(wTotal):'—'}</span>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="rep-sec-title">カテゴリ別の内訳</div>
  <div class="rep-cat-wrap">${renderCatBreakdownHtml(byCat, totalMin)}</div>
  <button class="csv-btn" onclick="exportCSV()">${svgUse('ic-download')}CSVでエクスポート</button>`;

  body.innerHTML = html;
}

/* ============================================================
   CSV EXPORT / IMPORT
   ============================================================ */
function exportCSV(){
  if(!recs.length){ toast('記録がありません'); return; }
  const rows=['category,date,time'];
  sortedRecs().forEach(r=>{
    const c=getCat(r.catId); const d=new Date(r.ts);
    rows.push(`${c?c.nm:'unknown'},${fmtDate(d)},${fmtTime(d)}`);
  });
  const blob=new Blob([rows.join('\n')], {type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`imalog_${fmtDate(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('CSVを書き出しました');
}
function triggerCSVImport(){ document.getElementById('csvImportInput').click(); }
function importCSV(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const lines=e.target.result.split('\n').map(l=>l.trim()).filter(Boolean);
      let added=0;
      lines.forEach((line,i)=>{
        if(i===0 && line.toLowerCase().startsWith('category')) return;
        const parts=line.split(',');
        if(parts.length<3) return;
        const [nm,date,time]=parts;
        let c=cats.find(c=>c.nm===nm.trim());
        if(!c){ c={id:uid(), nm:nm.trim(), ic:ICON_CHOICES[cats.length%ICON_CHOICES.length], c:COLOR_CHOICES[cats.length%COLOR_CHOICES.length]}; cats.push(c); }
        const ts=new Date(date.trim()+'T'+time.trim()+':00').toISOString();
        if(!isNaN(new Date(ts).getTime())){ recs.push({id:uid(), catId:c.id, ts}); added++; }
      });
      save(); saveCats(); renderDash();
      toast(`${added}件インポートしました`);
    }catch(err){ toast('CSVの読み込みに失敗しました'); }
    input.value='';
  };
  reader.readAsText(file);
}

function renderAccentPicker(){
  const wrap=document.getElementById('myAccPicker');
  wrap.innerHTML='';
  ACCENTS.forEach(a=>{
    const dot=document.createElement('div');
    dot.className='acc-dot'+(a===currentAccent?' on':'');
    dot.style.background=a;
    dot.onclick=()=>applyAccent(a,true);
    wrap.appendChild(dot);
  });
}
function applyAccent(color, persist){
  currentAccent=color;
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent2', color);
  if(persist){ localStorage.setItem(LS_ACC, color); renderAccentPicker(); toast('アクセントカラーを変更しました'); }
}
function toggleWeekStart(){
  weekStart = weekStart===1?0:1;
  localStorage.setItem(LS_WS, String(weekStart));
  renderMy();
  if(document.getElementById('pg-rep').classList.contains('active')) renderReport();
}
function toggleTheme(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const next=isDark?'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('thIcMoon').style.display = next==='dark'?'':'none';
  document.getElementById('thIcSun').style.display = next==='dark'?'none':'';
  document.getElementById('myThIc').innerHTML = `<use href="#${next==='dark'?'ic-moon':'ic-sun'}"/>`;
  document.getElementById('thLbl').textContent = next==='dark'?'ダーク':'ライト';
  document.getElementById('togDk').classList.toggle('on', next==='dark');
  document.getElementById('metaTheme').content = next==='dark'?'#121212':'#fdfdfd';
  localStorage.setItem(LS_TH, next);
}
function confirmClearAll(){
  showConfirm({title:'全記録を削除', msg:'すべての記録を削除します。\nこの操作は取り消せません。', okLabel:'すべて削除',
    cb:()=>{ recs=[]; save(); renderDash(); toast('すべて削除しました'); } });
}
function shareApp(){
  const text='イマログ - 「今何してる？」を記録・集計・振り返るアプリ';
  if(navigator.share){ navigator.share({title:'イマログ', text}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('コピーしました')).catch(()=>toast('コピーできませんでした')); }
}

/* ============================================================
   CATEGORY EDIT — dedicated page
   ============================================================ */
function openCatEditPage(catId){
  editingCatId=catId;
  const cat = catId ? getCat(catId) : null;
  document.getElementById('ceTitle').textContent = catId?'カテゴリを編集':'カテゴリを追加';
  document.getElementById('catDeleteBtn').style.display = catId?'block':'none';
  document.getElementById('catNameInput').value = cat?cat.nm:'';

  const selIcon = cat?cat.ic:ICON_CHOICES[0];
  const selColor = cat?cat.c:COLOR_CHOICES[0];

  const iconGrid=document.getElementById('catIconGrid');
  iconGrid.innerHTML='';
  const iconFrag=document.createDocumentFragment();
  ICON_CHOICES.forEach(ic=>{
    const opt=document.createElement('div');
    opt.className='icon-opt'+(ic===selIcon?' sel':'');
    opt.innerHTML=svgUse(ic);
    opt.onclick=()=>{
      iconGrid.querySelectorAll('.icon-opt').forEach(o=>o.classList.remove('sel'));
      opt.classList.add('sel'); iconGrid.dataset.selected=ic; ceUpdatePreview();
    };
    iconFrag.appendChild(opt);
  });
  iconGrid.appendChild(iconFrag);
  iconGrid.dataset.selected=selIcon;

  const colorGrid=document.getElementById('catColorGrid');
  colorGrid.innerHTML='';
  const colorFrag=document.createDocumentFragment();
  COLOR_CHOICES.forEach(col=>{
    const opt=document.createElement('div');
    opt.className='color-opt'+(col===selColor?' sel':'');
    opt.style.background=col;
    opt.onclick=()=>{
      colorGrid.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('sel'));
      opt.classList.add('sel'); colorGrid.dataset.selected=col; ceUpdatePreview();
    };
    colorFrag.appendChild(opt);
  });
  colorGrid.appendChild(colorFrag);
  colorGrid.dataset.selected=selColor;

  ceUpdatePreview();
  goPage('catedit-internal'); // custom transition, see below
}
function ceUpdatePreview(){
  const nm = document.getElementById('catNameInput').value.trim() || '新しいカテゴリ';
  const ic = document.getElementById('catIconGrid').dataset.selected || ICON_CHOICES[0];
  const col = document.getElementById('catColorGrid').dataset.selected || COLOR_CHOICES[0];
  document.getElementById('cePreviewNm').textContent = nm;
  document.getElementById('cePreviewIc').innerHTML = svgUse(ic);
  document.getElementById('cePreviewIc').style.background = col+'22';
  document.getElementById('cePreviewIc').style.color = col;
}
function saveCatEdit(){
  const nm=document.getElementById('catNameInput').value.trim();
  if(!nm){ toast('カテゴリ名を入力してください'); return; }
  const ic=document.getElementById('catIconGrid').dataset.selected;
  const c=document.getElementById('catColorGrid').dataset.selected;
  if(editingCatId){
    const cat=getCat(editingCatId);
    if(cat){ cat.nm=nm; cat.ic=ic; cat.c=c; }
  } else {
    cats.push({id:uid(), nm, ic, c});
  }
  saveCats(); closeCatEditPage(); renderDash(); renderMy();
  toast(editingCatId?'カテゴリを更新しました':'カテゴリを追加しました');
}
function deleteCatFromEdit(){
  if(!editingCatId) return;
  const id=editingCatId;
  const usedCount = recs.filter(r=>r.catId===id).length;
  showConfirm({
    title:'カテゴリを削除',
    msg: usedCount>0 ? `このカテゴリは${usedCount}件の記録で使われています。\nカテゴリを削除しても記録は残ります。` : 'このカテゴリを削除します。',
    okLabel:'削除する',
    cb:()=>{
      cats=cats.filter(c=>c.id!==id);
      saveCats(); closeCatEditPage(); renderDash(); renderMy();
      toast('カテゴリを削除しました');
    }
  });
}
function closeCatEditPage(){
  editingCatId=null;
  document.getElementById('pg-catedit').classList.remove('active');
  document.getElementById('pg-my').classList.add('active');
  document.getElementById('nv-my').classList.add('active');
}

/* ============================================================
   DRAWER / CONFIRM / TOAST
   ============================================================ */
function showDr(id){ document.getElementById('ov').classList.add('open'); document.getElementById(id).classList.add('open'); }
function closeAllDr(){
  document.getElementById('ov').classList.remove('open');
  document.querySelectorAll('.dr').forEach(d=>d.classList.remove('open'));
  editingRecId=null;
}
function showConfirm({title,msg,okLabel,cb}){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  const okBtn=document.getElementById('confirmOkBtn');
  okBtn.textContent=okLabel||'実行';
  okBtn.onclick=()=>{ closeConfirm(); cb(); };
  document.getElementById('confirmOv').classList.add('open');
}
function closeConfirm(){ document.getElementById('confirmOv').classList.remove('open'); }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   PWA install — build manifest + service worker from Blob URLs
   so a single HTML file still satisfies installability criteria
   (works on GitHub Pages / any static HTTPS host, no extra files)
   ============================================================ */
(function setupPWA(){
  try{
    const manifest = {
      name:'イマログ', short_name:'イマログ',
      description:'「今何してる？」を記録・集計・振り返るアプリ',
      display:'standalone', orientation:'portrait',
      background_color:'#121212', theme_color:'#121212',
      start_url: location.pathname + location.search,
      scope: location.pathname.replace(/[^/]*$/,''),
      icons:[
        {src:makeIconDataUrl(192), sizes:'192x192', type:'image/svg+xml', purpose:'any maskable'},
        {src:makeIconDataUrl(512), sizes:'512x512', type:'image/svg+xml', purpose:'any maskable'}
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link=document.createElement('link');
    link.rel='manifest'; link.href=manifestUrl;
    document.head.appendChild(link);

    if('serviceWorker' in navigator){
      const swSrc = `
        const CACHE='imalog-v1';
        self.addEventListener('install', e=>{ self.skipWaiting(); });
        self.addEventListener('activate', e=>{ self.clients.claim(); });
        self.addEventListener('fetch', e=>{
          e.respondWith(
            fetch(e.request).catch(()=> caches.match(e.request).then(r=> r || caches.match('${location.pathname}')))
          );
        });
      `;
      const swBlob = new Blob([swSrc], {type:'application/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
  }catch(e){ /* PWA setup best-effort; app still works without it */ }
})();
function makeIconDataUrl(size){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#121212"/><circle cx="12" cy="12" r="7" fill="none" stroke="#5bb88a" stroke-width="2"/><circle cx="12" cy="12" r="2.4" fill="#5bb88a"/></svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBtn').classList.add('show');
});
function installPWA(){
  if(!deferredPrompt){ toast('このブラウザはインストールに対応していません'); return; }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; document.getElementById('installBtn').classList.remove('show'); });
}
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBtn').classList.remove('show');
  toast('ホーム画面に追加しました');
});

   ============================================================ */

  const th=localStorage.getItem(LS_TH)||'dark';
  document.documentElement.setAttribute('data-theme', th);
  document.getElementById('thIcMoon').style.display = th==='dark'?'':'none';
  document.getElementById('thIcSun').style.display = th==='dark'?'none':'';
  document.getElementById('myThIc').innerHTML = `<use href="#${th==='dark'?'ic-moon':'ic-sun'}"/>`;
  document.getElementById('thLbl').textContent = th==='dark'?'ダーク':'ライト';
  document.getElementById('togDk').classList.toggle('on', th==='dark');
  document.getElementById('metaTheme').content = th==='dark'?'#121212':'#fdfdfd';
  applyAccent(currentAccent, false);
  renderDash();
  setInterval(()=>{ if(document.getElementById('pg-dash').classList.contains('active')){ renderStatus(); renderTimeline(); } }, 15000);
})();
