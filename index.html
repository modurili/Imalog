<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="イマログ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121212" id="metaTheme">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%E3%82%A4%E3%83%9E%E3%83%AD%E3%82%B0%22%2C%22short_name%22%3A%22%E3%82%A4%E3%83%9E%E3%83%AD%E3%82%B0%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23121212%22%2C%22theme_color%22%3A%22%23121212%22%2C%22start_url%22%3A%22.%22%7D">
<title>イマログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#5bb88a;--accent2:#3da66e;
}
[data-theme="dark"]{
  --bg:#121212;--bg2:#1a1a1a;--bg3:#202020;--bg4:#242424;
  --border:#2a2a2a;--border2:#333333;
  --text:#e5e5e5;--text2:#b3b3b3;--text3:#7a7a7a;
  --del:#ff5c5c;--nav:#161616;
  --shadow:0 4px 16px rgba(0,0,0,.6);
  --indigo:#6b8fd4;--indigo-s:rgba(107,143,212,.13);--indigo-d:rgba(107,143,212,.07);
  --amber:#d4a050;--amber-s:rgba(212,160,80,.13);--amber-d:rgba(212,160,80,.07);
  --violet:#9060e0;--violet-s:rgba(144,96,224,.13);
  --mint:#5bb88a;--mint-s:rgba(91,184,138,.13);
  --rose:#ff5c5c;--rose-s:rgba(255,92,92,.13);
  --r:14px;--rs:12px;--fh:62px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#fdfdfd;--bg2:#ffffff;--bg3:#f5f5f5;--bg4:#f0f0f0;
  --border:#e9e9e9;--border2:#e0e0e0;
  --text:#2d2d2d;--text2:#646464;--text3:#a5a5a5;
  --del:#d93c3c;--nav:#fafafa;
  --shadow:0 4px 16px rgba(45,45,45,.1);
  --indigo:#3d6dd4;--indigo-s:rgba(61,109,212,.12);--indigo-d:rgba(61,109,212,.06);
  --amber:#c07818;--amber-s:rgba(192,120,24,.12);--amber-d:rgba(192,120,24,.06);
  --violet:#7040c0;--violet-s:rgba(112,64,192,.09);
  --mint:#3da66e;--mint-s:rgba(61,166,110,.09);
  --rose:#d93c3c;--rose-s:rgba(217,60,60,.09);
  --r:14px;--rs:12px;--fh:62px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;overflow:hidden;}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{color:var(--accent);text-decoration:none;}
.shell{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;}
.pages{flex:1;overflow:hidden;position:relative;min-height:0;}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .2s,transform .2s;}
.page.active{opacity:1;pointer-events:auto;transform:translateY(0);}
.page::-webkit-scrollbar{width:0;}
/* FOOTER NAV */
.footer{flex-shrink:0;background:var(--nav);border-top:1px solid var(--border);display:flex;padding:6px 2px;padding-bottom:max(6px,env(safe-area-inset-bottom));}
.nav-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;color:var(--text3);font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;transition:color .15s;}
.nav-it:active{background:var(--bg3);}
.nav-it.active{color:var(--accent);}
.nav-ic{width:21px;height:21px;display:flex;align-items:center;justify-content:center;}
/* HEADER SHARED */
.dash-top,.pg-hd,.rep-week-nav{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;z-index:10;}
.pg-hd,.rep-week-nav{position:sticky;top:0;}
.app-nm{font-family:'Syne',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.5px;color:var(--accent);}
.pg-ti{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.3px;color:var(--text);}
.dash-top-right{display:flex;gap:6px;align-items:center;}
.th-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--bg2);color:var(--text3);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.th-btn:active{transform:scale(.9);background:var(--bg3);}
.install-btn{display:none;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent);font-size:11px;font-family:'Syne',sans-serif;font-weight:700;}
.install-btn.show{display:flex;}
/* DASHBOARD */
#pg-dash{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.d-stat{margin:10px 14px 0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;flex-shrink:0;position:relative;overflow:hidden;transition:border-color .3s;}
.d-stat::before{content:'';position:absolute;top:-40px;right:-40px;width:100px;height:100px;border-radius:50%;pointer-events:none;opacity:.06;transition:background .3s;background:var(--cur-color,var(--text3));}
.st-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.st-hd{display:flex;align-items:center;gap:7px;}
.st-dot{width:8px;height:8px;border-radius:50%;background:var(--cur-color,var(--text3));flex-shrink:0;animation:pd 2s infinite;}
@keyframes pd{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cur-color,var(--text3)) 50%,transparent);}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--cur-color,var(--text3)) 0%,transparent);}}
.st-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);}
.st-elapsed{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-family:'DM Mono',monospace;font-size:11px;background:color-mix(in srgb,var(--cur-color,var(--text3)) 13%,transparent);color:var(--cur-color,var(--text3));flex-shrink:0;}
.st-main{display:flex;align-items:center;gap:9px;margin-bottom:2px;}
.st-emoji{font-size:26px;line-height:1;}
.st-name{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;line-height:1.15;color:var(--text);}
.st-sub{font-size:11px;color:var(--text2);margin-top:2px;}
/* TODAY STATS */
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 14px 0;flex-shrink:0;}
.st-c{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 6px;text-align:center;}
.st-v{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;white-space:nowrap;}
.st-l{font-size:9px;color:var(--text2);line-height:1.4;}
/* TIMELINE BAR (today) */
.d-tl{margin:8px 14px 0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;flex-shrink:0;}
.d-tl-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.d-tl-ti{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);}
.d-tl-bar{display:flex;width:100%;height:22px;border-radius:6px;overflow:hidden;background:var(--bg3);}
.d-tl-seg{height:100%;transition:width .3s;}
.d-tl-hrs{display:flex;justify-content:space-between;margin-top:4px;}
.d-tl-hrs span{font-family:'DM Mono',monospace;font-size:8px;color:var(--text3);}
.d-tl-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.leg-it{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
/* ACTIVITY PICKER GRID */
.d-acts-wrap{flex:1;min-height:0;overflow-y:auto;margin:8px 14px 0;padding-bottom:10px;}
.d-acts-wrap::-webkit-scrollbar{width:0;}
.d-acts-hd{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px;}
.d-acts-ti{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);}
.d-acts-edit{font-size:11px;color:var(--accent);font-weight:500;}
.d-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.a-btn{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--rs);padding:13px 12px;display:flex;flex-direction:row;align-items:center;gap:10px;transition:all .15s;text-align:left;position:relative;}
.a-btn:active{transform:scale(.96);}
.a-btn.cur{background:var(--a-s,var(--bg2));border-color:var(--a-c,var(--border));}
.a-btn.cur::after{content:'';position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--a-c);}
.ab-ic{font-size:20px;flex-shrink:0;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--a-s,var(--bg3));}
.ab-body{display:flex;flex-direction:column;gap:1px;min-width:0;}
.ab-ti{font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ab-tm{font-family:'DM Mono',monospace;font-size:9px;color:var(--text2);}
.a-btn-add{background:var(--bg2);border:1.5px dashed var(--border2);border-radius:var(--rs);padding:13px 12px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text3);font-size:12px;font-weight:500;transition:all .15s;}
.a-btn-add:active{background:var(--bg3);}
/* RECORDS PAGE */
#pg-rec{display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;}
.rl-wrap{flex:1;overflow-y:auto;padding:10px 14px 24px;-webkit-overflow-scrolling:touch;}
.rl-wrap::-webkit-scrollbar{width:0;}
.rec-dg-hd{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:10px 2px 5px;}
.rec-dg-hd:first-child{padding-top:2px;}
@keyframes popUp{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.rec-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:8px;animation:popUp .2s cubic-bezier(.34,1.56,.64,1);}
.rec-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--r-s,var(--bg3));}
.rec-body{flex:1;min-width:0;}
.rec-nm{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);}
.rec-tm{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);margin-top:1px;}
.rec-dur{font-family:'DM Mono',monospace;font-size:12px;color:var(--r-c,var(--text2));background:color-mix(in srgb,var(--r-c,var(--text2)) 12%,transparent);padding:3px 9px;border-radius:10px;flex-shrink:0;}
.rec-acts{display:flex;gap:4px;flex-shrink:0;}
.rib{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2);transition:all .15s;}
.rib:active{transform:scale(.88);}
.rib.dl:active{color:var(--del);border-color:rgba(255,92,92,.3);background:rgba(255,92,92,.06);}
.rib.ed:active{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 42%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent);}
.empty{text-align:center;padding:56px 24px;color:var(--text2);font-size:13px;line-height:1.8;}
.fab{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 3px 14px color-mix(in srgb,var(--accent) 45%,transparent);transition:all .2s;z-index:6;}
.fab:active{transform:scale(.94);}
/* REPORT PAGE */
#pg-rep{overflow-y:auto;}
#pg-rep::-webkit-scrollbar{width:0;}
.rep-wk-ti{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);}
.rep-nb{width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;transition:all .15s;}
.rep-nb:active{transform:scale(.9);background:var(--bg3);}
#repContent{padding:10px 14px 0;}
.rep-hero{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px;}
.rep-hcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:13px;position:relative;overflow:hidden;}
.rep-hcard::before{content:'';position:absolute;bottom:-16px;right:-16px;width:60px;height:60px;border-radius:50%;opacity:.06;pointer-events:none;background:var(--accent);}
.rep-hl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:5px;}
.rep-hv{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);line-height:1;}
.rep-hsub{font-size:10px;color:var(--text2);margin-top:3px;}
.rep-chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:8px;}
.rep-chart-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:12px;}
.rep-bars{display:flex;align-items:flex-end;gap:5px;height:90px;}
.rep-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;}
.rep-bar-bg{width:100%;flex:1;background:var(--bg3);border-radius:4px;position:relative;overflow:hidden;min-height:0;display:flex;flex-direction:column-reverse;}
.rep-bar-seg{width:100%;}
.rep-bar-lbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--text2);}
.rep-bar-val{font-family:'DM Mono',monospace;font-size:8px;color:var(--text3);min-height:10px;}
/* Category breakdown */
.rep-cat-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;margin-bottom:8px;}
.rep-cat-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);padding:11px 14px 7px;border-bottom:1px solid var(--border);}
.rep-cat-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);}
.rep-cat-row:first-of-type{border-top:none;}
.rep-cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.rep-cat-nm{font-size:12.5px;color:var(--text);flex:1;min-width:0;}
.rep-cat-bar-bg{flex:1.4;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.rep-cat-bar-fill{height:100%;border-radius:3px;}
.rep-cat-v{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);width:50px;text-align:right;flex-shrink:0;}
.rep-table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;margin-bottom:8px;}
.rep-table-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);padding:11px 14px 7px;border-bottom:1px solid var(--border);}
.rep-day-group{border-bottom:1px solid var(--border);}
.rep-day-group:last-child{border-bottom:none;}
.rep-day-hd{display:flex;align-items:center;justify-content:space-between;padding:7px 14px 4px;background:var(--bg3);}
.rep-day-name{font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);}
.rep-day-total{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);}
.rep-sess-row{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 16px;border-top:1px solid var(--border);}
.rep-sess-row:first-of-type{border-top:none;}
.rep-cell{font-family:'DM Mono',monospace;font-size:11px;color:var(--text);}
.rep-cell.dur{color:var(--accent);margin-left:auto;}
.csv-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);margin:6px 14px 24px;padding:12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;}
.csv-btn:active{background:var(--bg3);color:var(--text);}
/* MY PAGE */
#pg-my{overflow-y:auto;}
#pg-my::-webkit-scrollbar{width:0;}
.my-sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:14px 14px 8px;}
.my-sec:first-of-type{margin-top:14px;}
.my-st{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:10px 14px 8px;border-bottom:1px solid var(--border);}
.my-sg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);}
.my-sv{background:var(--bg2);padding:13px;text-align:center;}
.my-svv{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--text);margin-bottom:3px;}
.my-svl{font-size:10px;color:var(--text2);}
.my-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);}
.my-row:last-child{border-bottom:none;}
.my-rv{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);}
.my-row.tap{cursor:pointer;transition:background .15s;}
.my-row.tap:active{background:var(--bg3);}
.my-row.danger{color:var(--del);}
.tog{width:44px;height:25px;border-radius:13px;background:var(--bg4);border:1px solid var(--border2);cursor:pointer;position:relative;padding:0;flex-shrink:0;transition:background .2s,border-color .2s;}
.tog.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);}
.tog-k{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--text3);transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .2s;box-shadow:0 1px 3px rgba(0,0,0,.35);}
.tog.on .tog-k{transform:translateX(19px);background:var(--accent);}
/* CATEGORY MANAGE LIST */
.cat-list-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
.cat-list-row:last-child{border-bottom:none;}
.cat-list-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.cat-list-nm{flex:1;font-size:13px;color:var(--text);}
.cat-list-acts{display:flex;gap:4px;}
/* ACCENT PICKER */
.acc-picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.acc-dot{width:26px;height:26px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s;flex-shrink:0;}
.acc-dot.on{border-color:var(--text);transform:scale(1.2);}
.acc-dot:active{transform:scale(1.1);}
/* OVERLAY & DRAWERS */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;}
.ov.open{opacity:1;pointer-events:auto;}
.dr{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--border2);z-index:51;transition:transform .3s cubic-bezier(.32,1,.32,1),visibility 0s .3s;box-shadow:var(--shadow);padding-bottom:max(16px,env(safe-area-inset-bottom));visibility:hidden;}
.dr.open{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.32,1,.32,1),visibility 0s 0s;}
.dr-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:11px auto 12px;}
.dr-ti{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;text-align:center;color:var(--text);margin-bottom:14px;}
.dr-field{margin:0 14px 12px;}
.dr-field label{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:6px;}
.dr-input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--rs);padding:10px 13px;font-size:15px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit;}
.dr-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent);}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 14px 12px;}
.emoji-opt{width:100%;aspect-ratio:1;border-radius:12px;background:var(--bg3);border:2px solid transparent;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer;}
.emoji-opt:active{transform:scale(.9);}
.emoji-opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.color-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 14px 12px;}
.color-opt{width:100%;aspect-ratio:1;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform .15s;}
.color-opt.sel{border-color:var(--text);transform:scale(1.15);}
.dr-ok{margin:4px 14px 6px;width:calc(100% - 28px);padding:13px;border-radius:14px;background:var(--accent);color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;transition:all .15s;box-shadow:0 4px 18px color-mix(in srgb,var(--accent) 35%,transparent);}
.dr-ok:active{background:var(--accent2);transform:scale(.98);}
.dr-ok.secondary{background:var(--bg3);color:var(--text2);box-shadow:none;border:1px solid var(--border2);}
.dr-time-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 14px 12px;}
/* CONFIRM */
.confirm-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:none;align-items:center;justify-content:center;padding:24px;}
.confirm-ov.open{display:flex;}
.confirm-box{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:22px;width:100%;max-width:300px;text-align:center;box-shadow:var(--shadow);animation:popUp .2s cubic-bezier(.34,1.3,.64,1);}
.confirm-icon{display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--del);}
.confirm-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;text-align:center;margin-bottom:7px;color:var(--text);}
.confirm-msg{font-size:13px;color:var(--text2);text-align:center;line-height:1.65;margin-bottom:18px;white-space:pre-line;}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.confirm-btn{padding:12px;border-radius:12px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;transition:all .15s;}
.confirm-btn:active{transform:scale(.96);}
.confirm-btn.cancel{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);}
.confirm-btn.ok{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.28);color:var(--del);}
.confirm-btn.ok:active{background:var(--del);color:#fff;border-color:var(--del);}
.confirm-btn.ok.safe{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 32%,transparent);color:var(--accent);}
.confirm-btn.ok.safe:active{background:var(--accent);color:#fff;border-color:var(--accent);}
/* TOAST */
.toast{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom) + 10px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg4);border:1px solid var(--border2);border-radius:20px;padding:7px 16px;font-size:12px;color:var(--text);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<script>
/* ============================================================
   イマログ — 今何してる？記録アプリ
   データモデル: recs = [{id, catId, ts (ISO string, 開始時刻)}]
   「終了」は次のレコードの開始時刻で自動決定（進行中は現在時刻）
   ============================================================ */

const LS_RECS = 'imalog_recs';
const LS_CATS = 'imalog_cats';
const LS_TH   = 'imalog_theme';
const LS_ACC  = 'imalog_accent';
const LS_WS   = 'imalog_weekstart';

const DEFAULT_CATS = [
  {id:'work',  nm:'仕事', ic:'💼', c:'#6b8fd4'},
  {id:'break', nm:'休憩', ic:'☕', c:'#d4a050'},
  {id:'move',  nm:'移動', ic:'🚃', c:'#9060e0'},
  {id:'meal',  nm:'食事', ic:'🍚', c:'#e0708a'},
  {id:'study', nm:'勉強', ic:'📚', c:'#5bb88a'},
  {id:'sleep', nm:'睡眠', ic:'😴', c:'#5580c0'},
];

const ACCENTS = ['#5bb88a','#6b8fd4','#d4a050','#e0708a','#9060e0','#4fb5c0'];
const EMOJI_CHOICES = ['💼','☕','🚃','🍚','📚','😴','🎮','🏃','🛁','📱','🧹','🛒','🎨','🎵','💤','🧘','👥','🐶','📺','📝','💻','🍺','🏋️','🌳'];
const COLOR_CHOICES = ['#5bb88a','#6b8fd4','#d4a050','#e0708a','#9060e0','#4fb5c0','#e0a868','#c0596b','#7dc4a8','#8896c8'];

let recs = JSON.parse(localStorage.getItem(LS_RECS) || '[]');
let cats = JSON.parse(localStorage.getItem(LS_CATS) || 'null') || DEFAULT_CATS.slice();
let currentAccent = localStorage.getItem(LS_ACC) || '#5bb88a';
let weekStart = parseInt(localStorage.getItem(LS_WS) || '1');
let repWeekOffset = 0;
let editingCatId = null;   // カテゴリ編集drawerでの対象id (nullなら新規)
let editingRecId = null;   // 手動記録drawerでの対象id (nullなら新規)
let deferredPrompt = null;

function save(){ localStorage.setItem(LS_RECS, JSON.stringify(recs)); }
function saveCats(){ localStorage.setItem(LS_CATS, JSON.stringify(cats)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function getCat(id){ return cats.find(c=>c.id===id); }

/* ---------- time helpers ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayKey(d){ return fmtDate(d); }
function fmtDur(mins){
  if(mins<1) return '1分未満';
  const h=Math.floor(mins/60), m=Math.round(mins%60);
  if(h===0) return `${m}分`;
  if(m===0) return `${h}時間`;
  return `${h}時間${m}分`;
}
function fmtElapsed(startTs){
  const mins = Math.floor((Date.now()-new Date(startTs).getTime())/60000);
  return fmtDur(Math.max(mins,0));
}

/* sorted ascending by ts */
function sortedRecs(){ return [...recs].sort((a,b)=>new Date(a.ts)-new Date(b.ts)); }

/* returns array of {rec, start, end, durMin} — end is next rec's start or now for last */
function sessionsFrom(list){
  const s = [...list].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const out = [];
  for(let i=0;i<s.length;i++){
    const start = new Date(s[i].ts);
    const end = i+1<s.length ? new Date(s[i+1].ts) : new Date();
    const durMin = Math.max(0,(end-start)/60000);
    out.push({rec:s[i], start, end, durMin, isCurrent: i+1>=s.length});
  }
  return out;
}

/* ---------- NAV ---------- */
function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-it').forEach(n=>n.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  const nv=document.getElementById('nv-'+name); if(nv) nv.classList.add('active');
  if(name==='rec') renderRec();
  if(name==='rep') renderReport();
  if(name==='my') renderMy();
  if(name==='dash') renderDash();
}

/* ---------- LOG NOW (main action) ---------- */
function logNow(catId){
  const now = new Date();
  recs.push({id:uid(), catId, ts: now.toISOString()});
  save();
  renderAll();
  const c = getCat(catId);
  toast(`${c ? c.nm : ''}を記録しました`);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDash(){
  renderStatus();
  renderTodayStats();
  renderTimeline();
  renderActButtons();
}

function renderStatus(){
  const s = sortedRecs();
  const dStat = document.getElementById('dStat');
  if(!s.length){
    dStat.style.removeProperty('--cur-color');
    document.getElementById('stEmoji').textContent='❓';
    document.getElementById('stName').textContent='未記録';
    document.getElementById('stSub').textContent='下のボタンから今の行動を記録しよう';
    document.getElementById('stElapsed').textContent='—';
    return;
  }
  const last = s[s.length-1];
  const c = getCat(last.catId);
  dStat.style.setProperty('--cur-color', c ? c.c : '#7a7a7a');
  document.getElementById('stEmoji').textContent = c ? c.ic : '❓';

    const endMs = Math.min(dayMs, x.end - dayStart);

function fmtDayHeader(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((today-dd)/86400000);
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  const base = `${d.getMonth()+1}月${d.getDate()}日（${wd}）`;
  if(diff===0) return '今日 · '+base;
  if(diff===1) return '昨日 · '+base;
  return base;
}

   ============================================================ */
function getWeekRange(offset){
  const now = new Date();
  const day = now.getDay(); // 0 sun
  const diffToStart = weekStart===1 ? (day===0?-6:1-day) : -day;
  const start = new Date(now); start.setHours(0,0,0,0);
  start.setDate(start.getDate()+diffToStart+offset*7);
  const end = new Date(start); end.setDate(start.getDate()+7);
  return {start,end};
}

function chRepWk(delta){ repWeekOffset+=delta; renderReport(); }

function renderReport(){
  const {start,end} = getWeekRange(repWeekOffset);
  const titleEl = document.getElementById('repWkTi');
  titleEl.textContent = repWeekOffset===0 ? '今週のレポート' :
    `${start.getMonth()+1}/${start.getDate()} 〜 ${new Date(end-1).getMonth()+1}/${new Date(end-1).getDate()}`;

  const sess = sessionsFrom(sortedRecs()).filter(x=>x.start>=start && x.start<end);
  const content = document.getElementById('repContent');
  content.innerHTML='';

  if(!sess.length){
    content.innerHTML = `<div class="empty">この週の記録はありません</div>`;
    return;
  }

  // hero cards
  const totalMin = sess.reduce((a,x)=>a+x.durMin,0);
  const byCat = {};
  sess.forEach(x=>{ byCat[x.rec.catId]=(byCat[x.rec.catId]||0)+x.durMin; });
  let topId=null, topV=-1;
  Object.entries(byCat).forEach(([k,v])=>{ if(v>topV){topV=v;topId=k;} });
  const topC = getCat(topId);
  const daysCounted = new Set(sess.map(x=>dayKey(x.start))).size;

  const hero = document.createElement('div'); hero.className='rep-hero';
  hero.innerHTML = `
    <div class="rep-hcard"><div class="rep-hl">記録数</div><div class="rep-hv">${sess.length}</div><div class="rep-hsub">件</div></div>
    <div class="rep-hcard"><div class="rep-hl">最多カテゴリ</div><div class="rep-hv" style="font-size:16px">${topC?topC.ic+' '+esc(topC.nm):'—'}</div><div class="rep-hsub">${topC?fmtDur(topV):''}</div></div>`;
  content.appendChild(hero);

  // daily bar chart (stacked by category, total minutes)
  const chartWrap = document.createElement('div'); chartWrap.className='rep-chart-wrap';
  const daysArr = [];
  for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); daysArr.push(d); }
  const maxDay = Math.max(...daysArr.map(d=>{
    const dk=dayKey(d);
    return sess.filter(x=>dayKey(x.start)===dk).reduce((a,x)=>a+x.durMin,0);
  }), 1);
  let barsHtml = `<div class="rep-chart-title">日別の記録時間</div><div class="rep-bars">`;
  daysArr.forEach(d=>{
    const dk=dayKey(d);
    const daySess = sess.filter(x=>dayKey(x.start)===dk);
    const dTotal = daySess.reduce((a,x)=>a+x.durMin,0);
    const heightPct = dTotal/maxDay*100;
    const isToday = dayKey(new Date())===dk;
    let segsHtml='';
    if(dTotal>0){
      daySess.forEach(x=>{
        const c=getCat(x.rec.catId);
        const segPct = x.durMin/dTotal*100;
        segsHtml += `<div class="rep-bar-seg" style="height:${segPct}%;background:${c?c.c:'#666'}"></div>`;
      });
    }
    barsHtml += `<div class="rep-bar-wrap">
      <div class="rep-bar-val">${dTotal>0?Math.round(dTotal/60*10)/10+'h':''}</div>
      <div class="rep-bar-bg" style="height:${Math.max(heightPct,dTotal>0?4:0)}%">${segsHtml}</div>
      <div class="rep-bar-lbl" style="${isToday?'color:var(--accent);font-weight:700':''}">${['日','月','火','水','木','金','土'][d.getDay()]}</div>
    </div>`;
  });
  barsHtml += `</div>`;
  chartWrap.innerHTML = barsHtml;
  content.appendChild(chartWrap);

  // category breakdown
  const catWrap = document.createElement('div'); catWrap.className='rep-cat-wrap';
  let catHtml = `<div class="rep-cat-title">カテゴリ別の内訳</div>`;
  Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(([id,mins])=>{
    const c=getCat(id);
    const pct = mins/totalMin*100;
    catHtml += `<div class="rep-cat-row">
      <span class="rep-cat-dot" style="background:${c?c.c:'#7a7a7a'}"></span>
      <span class="rep-cat-nm">${c?c.ic+' '+esc(c.nm):'（削除済み）'}</span>
      <div class="rep-cat-bar-bg"><div class="rep-cat-bar-fill" style="width:${pct}%;background:${c?c.c:'#7a7a7a'}"></div></div>
      <span class="rep-cat-v">${fmtDur(mins)}</span>
    </div>`;
  });
  catWrap.innerHTML = catHtml;
  content.appendChild(catWrap);

  // day-by-day table
  const tableWrap = document.createElement('div'); tableWrap.className='rep-table-wrap';
  let tableHtml = `<div class="rep-table-title">日別詳細</div>`;
  daysArr.slice().reverse().forEach(d=>{
    const dk=dayKey(d);
    const daySess = sess.filter(x=>dayKey(x.start)===dk).sort((a,b)=>b.start-a.start);
    if(!daySess.length) return;
    const dTotal = daySess.reduce((a,x)=>a+x.durMin,0);
    tableHtml += `<div class="rep-day-group">
      <div class="rep-day-hd"><span class="rep-day-name">${fmtDayHeader(d)}</span><span class="rep-day-total">${fmtDur(dTotal)}</span></div>`;
    daySess.forEach(x=>{
      const c=getCat(x.rec.catId);
      tableHtml += `<div class="rep-sess-row">
        <span class="rep-cell">${c?c.ic:'❓'}</span>
        <span class="rep-cell">${esc(c?c.nm:'（削除済み）')}</span>
        <span class="rep-cell" style="color:var(--text2)">${fmtTime(x.start)}〜${x.isCurrent?'':fmtTime(x.end)}</span>
        <span class="rep-cell dur">${x.isCurrent?'記録中':fmtDur(x.durMin)}</span>
      </div>`;
    });
    tableHtml += `</div>`;
  });
  tableWrap.innerHTML = tableHtml;
  content.appendChild(tableWrap);
}

function exportCSV(){
  if(!recs.length){ toast('記録がありません'); return; }
  const rows = ['category,date,time'];
  sortedRecs().forEach(r=>{
    const c=getCat(r.catId);
    const d=new Date(r.ts);
    rows.push(`${c?c.nm:'unknown'},${fmtDate(d)},${fmtTime(d)}`);
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`imalog_${fmtDate(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSVを書き出しました');
}
function triggerCSVImport(){ document.getElementById('csvImportInput').click(); }
function importCSV(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const lines = e.target.result.split('\n').map(l=>l.trim()).filter(Boolean);
      let added=0;
      lines.forEach((line,i)=>{
        if(i===0 && line.toLowerCase().startsWith('category')) return;
        const parts = line.split(',');
        if(parts.length<3) return;
        const [nm,date,time] = parts;
        let c = cats.find(c=>c.nm===nm.trim());
        if(!c){
          c = {id:uid(), nm:nm.trim(), ic:'📌', c: COLOR_CHOICES[cats.length % COLOR_CHOICES.length]};
          cats.push(c);
        }
        const ts = new Date(date.trim()+'T'+time.trim()+':00').toISOString();
        if(!isNaN(new Date(ts).getTime())){
          recs.push({id:uid(), catId:c.id, ts});
          added++;
        }
      });
      save(); saveCats(); renderAll();
      toast(`${added}件インポートしました`);
    }catch(err){
      toast('CSVの読み込みに失敗しました');
    }
    input.value='';
  };
  reader.readAsText(file);
}

function toggleWeekStart(){
  weekStart = weekStart===1?0:1;
  localStorage.setItem(LS_WS, String(weekStart));
  renderMy();
  if(document.querySelector('.page.active')?.id==='pg-rep') renderReport();
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  const next = isDark?'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  const moon=document.getElementById('thIcMoon'), sun=document.getElementById('thIcSun');
  moon.style.display = next==='dark'?'':'none';
  sun.style.display = next==='dark'?'none':'';
  document.getElementById('thLbl').textContent = next==='dark'?'ダーク':'ライト';
  document.getElementById('togDk').classList.toggle('on', next==='dark');
  document.getElementById('metaTheme').content = next==='dark'?'#121212':'#fdfdfd';
  localStorage.setItem(LS_TH, next);
}
function confirmClearAll(){
  showConfirm({
    title:'全記録を削除',
    msg:'すべての記録を削除します。\nこの操作は取り消せません。',
    okLabel:'すべて削除',
    cb:()=>{ recs=[]; save(); renderAll(); toast('すべて削除しました'); }
  });
}
function shareApp(){
  const text='イマログ - 「今何してる？」を記録・集計・振り返るアプリ';
  if(navigator.share){
    navigator.share({title:'イマログ', text}).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast('コピーしました')).catch(()=>toast('コピーできませんでした'));
  }
}

/* ============================================================
   DRAWER / OVERLAY / CONFIRM / TOAST
   ============================================================ */
function showDr(id){
  document.getElementById('ov').classList.add('open');
  document.getElementById(id).classList.add('open');
}
function closeAllDr(){
  document.getElementById('ov').classList.remove('open');
  document.querySelectorAll('.dr').forEach(d=>d.classList.remove('open'));
  editingCatId=null; editingRecId=null;
}
function showConfirm({title,msg,okLabel,cb}){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  const okBtn=document.getElementById('confirmOkBtn');
  okBtn.textContent=okLabel||'実行';
  okBtn.onclick=()=>{ closeConfirm(); cb(); };
  document.getElementById('confirmOv').classList.add('open');
}
function closeConfirm(){ document.getElementById('confirmOv').classList.remove('open'); }

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   PWA install
   ============================================================ */
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBtn').classList.add('show');
});
function installPWA(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{
    deferredPrompt=null;
    document.getElementById('installBtn').classList.remove('show');
  });
}
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBtn').classList.remove('show');
  toast('ホーム画面に追加しました');
});

/* ============================================================
   INIT
   ============================================================ */
function renderAll(){
  renderDash(); 
  const ap=document.querySelector('.page.active');
  if(ap?.id==='pg-rec') renderRec();
  if(ap?.id==='pg-rep') renderReport();
  if(ap?.id==='pg-my') renderMy();
}
(function init(){
  const th = localStorage.getItem(LS_TH) || 'dark';
  document.documentElement.setAttribute('data-theme', th);
  const moon=document.getElementById('thIcMoon'), sun=document.getElementById('thIcSun');
  moon.style.display = th==='dark'?'':'none';
  sun.style.display = th==='dark'?'none':'';
  document.getElementById('thLbl').textContent = th==='dark'?'ダーク':'ライト';
  document.getElementById('togDk').classList.toggle('on', th==='dark');
  document.getElementById('metaTheme').content = th==='dark'?'#121212':'#fdfdfd';
  applyAccent(currentAccent, false);
  renderAll();
  setInterval(()=>{ if(document.querySelector('.page.active')?.id==='pg-dash'){ renderStatus(); renderTimeline(); } }, 15000);
})();
</script>
